name: Update GitHub Stats

on:
  schedule:
    # Run once per day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch GitHub Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch user stats
          USER_DATA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/users/beywesley1")

          # Fetch repos
          REPOS_DATA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/users/beywesley1/repos?sort=updated&per_page=6")

          # Extract stats
          PUBLIC_REPOS=$(echo $USER_DATA | jq '.public_repos')
          FOLLOWERS=$(echo $USER_DATA | jq '.followers')

          # Calculate total stars and forks
          TOTAL_STARS=$(echo $REPOS_DATA | jq '[.[].stargazers_count] | add')
          TOTAL_FORKS=$(echo $REPOS_DATA | jq '[.[].forks_count] | add')

          # Update fallback file
          cat > portfolio/src/githubFallback.js << EOF
          // Auto-generated by GitHub Actions - DO NOT EDIT MANUALLY
          // Last updated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          export const GITHUB_FALLBACK = {
            beywesley1: {
              stats: {
                publicRepos: $PUBLIC_REPOS,
                followers: $FOLLOWERS,
              },
              linesOfCode: {
                added: 150000, // Update manually or calculate via API
                deleted: 50000,
              },
              repos: $(echo $REPOS_DATA | jq '[.[] | {
                name: .name,
                description: .description,
                stargazers_count: .stargazers_count,
                forks_count: .forks_count,
                languages: {}
              }]'),
              lastUpdated: '$(date -u +"%Y-%m-%d")'
            }
          };

          export function getFallbackData(username) {
            return GITHUB_FALLBACK[username] || null;
          }
          EOF

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add portfolio/src/githubFallback.js
          git diff --staged --quiet || git commit -m "chore: update GitHub stats [skip ci]"
          git push
