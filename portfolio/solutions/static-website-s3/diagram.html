<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static Website S3 - Architecture Diagram</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    h1 {
      color: #c9d1d9;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .instructions {
      color: #8b949e;
      margin-bottom: 20px;
      text-align: center;
      max-width: 800px;
      line-height: 1.6;
    }
    .instructions code {
      background: #21262d;
      padding: 2px 6px;
      border-radius: 4px;
      color: #58a6ff;
    }
    .diagram-container {
      background: #161b22;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #30363d;
      overflow: auto;
      max-width: 100%;
    }
    svg {
      display: block;
    }
  </style>
</head>
<body>
  <h1>Static Website S3 - Architecture Diagram</h1>
  <p class="instructions">
    CloudFlare DNS → CloudFront CDN → S3 Static Website<br>
    Edit this file to modify the diagram. Open in browser to preview.
  </p>
  
  <div class="diagram-container">
    <svg viewBox="0 0 1000 500" width="1000" height="500">
      <!-- Background Gradients & Definitions -->
      <defs>
        <linearGradient id="awsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1a1a2e" />
          <stop offset="100%" stop-color="#16213e" />
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <marker id="arrowheadOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#F6821F"/>
        </marker>
        <marker id="arrowheadPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#8B5CF6"/>
        </marker>
        <marker id="arrowheadGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
        </marker>
        
        <!-- Icons -->
        <symbol id="user-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4" fill="none" stroke="#60a5fa" stroke-width="2"/>
          <path d="M4 20c0-4 4-6 8-6s8 2 8 6" fill="none" stroke="#60a5fa" stroke-width="2"/>
        </symbol>
        <symbol id="cloudflare-icon" viewBox="0 0 24 24">
          <path d="M16.5 8.5c-.3-1.4-1.5-2.5-3-2.5-1.3 0-2.4.8-2.9 2-.4-.3-.9-.5-1.4-.5-1.4 0-2.5 1.1-2.5 2.5 0 .2 0 .3.1.5C5.2 10.7 4 12 4 13.5 4 15.4 5.6 17 7.5 17h9c1.9 0 3.5-1.6 3.5-3.5 0-1.8-1.4-3.3-3.1-3.5l-.4-1.5z" fill="#F6821F"/>
        </symbol>
        <symbol id="cloudfront-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" fill="none" stroke="#8B5CF6" stroke-width="2"/>
          <circle cx="12" cy="12" r="4" fill="#8B5CF6"/>
          <path d="M12 3v4M12 17v4M3 12h4M17 12h4" stroke="#8B5CF6" stroke-width="2"/>
        </symbol>
        <symbol id="s3-icon" viewBox="0 0 24 24">
          <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" fill="none" stroke="#22c55e" stroke-width="2"/>
          <path d="M12 7L6 10v4l6 3 6-3v-4l-6-3z" fill="#22c55e" fill-opacity="0.3"/>
        </symbol>
        <symbol id="certificate-icon" viewBox="0 0 24 24">
          <rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="#f59e0b" stroke-width="2"/>
          <path d="M9 12l2 2 4-4" stroke="#f59e0b" stroke-width="2" fill="none"/>
        </symbol>
      </defs>
      
      <!-- User -->
      <rect x="40" y="180" width="100" height="80" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
      <use href="#user-icon" x="60" y="195" width="30" height="30"/>
      <text x="90" y="245" fill="#60a5fa" font-size="12" text-anchor="middle" font-weight="bold" font-family="monospace">User</text>
      <text x="90" y="258" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="monospace">Browser</text>
      
      <!-- Arrow User to CloudFlare -->
      <line x1="140" y1="220" x2="195" y2="220" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowheadOrange)"/>
      <text x="168" y="210" fill="#60a5fa" font-size="8" text-anchor="middle" font-family="monospace">DNS Query</text>
      
      <!-- CloudFlare -->
      <rect x="200" y="160" width="140" height="120" rx="8" fill="#1a1a2e" stroke="#F6821F" stroke-width="2"/>
      <use href="#cloudflare-icon" x="215" y="175" width="35" height="35"/>
      <text x="270" y="200" fill="#F6821F" font-size="13" text-anchor="middle" font-weight="bold" font-family="monospace">CloudFlare</text>
      <text x="270" y="218" fill="#FAAD3F" font-size="9" text-anchor="middle" font-family="monospace">DNS Management</text>
      <text x="270" y="235" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">example.com</text>
      <text x="270" y="250" fill="#6ee7b7" font-size="8" text-anchor="middle" font-family="monospace">CNAME → CloudFront</text>
      <text x="270" y="268" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">SSL: Full Mode</text>
      
      <!-- Arrow CloudFlare to CloudFront -->
      <line x1="340" y1="220" x2="425" y2="220" stroke="#F6821F" stroke-width="2" marker-end="url(#arrowheadPurple)"/>
      <text x="383" y="210" fill="#F6821F" font-size="8" text-anchor="middle" font-family="monospace">HTTPS</text>
      
      <!-- AWS Cloud Border -->
      <rect x="415" y="50" width="560" height="400" rx="12" fill="none" stroke="#FF9900" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
      <text x="695" y="75" fill="#FF9900" font-size="14" font-family="monospace" font-weight="bold">AWS Cloud</text>
      
      <!-- CloudFront -->
      <rect x="430" y="140" width="180" height="160" rx="8" fill="#232f3e" stroke="#8B5CF6" stroke-width="2" filter="url(#glow)"/>
      <use href="#cloudfront-icon" x="445" y="155" width="40" height="40"/>
      <text x="520" y="185" fill="#8B5CF6" font-size="14" text-anchor="middle" font-weight="bold" font-family="monospace">CloudFront</text>
      <text x="520" y="205" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="monospace">CDN Distribution</text>
      <text x="520" y="225" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">d1234abcd.cloudfront.net</text>
      <text x="520" y="245" fill="#22d3ee" font-size="8" text-anchor="middle" font-family="monospace">Edge Caching</text>
      <text x="520" y="260" fill="#22d3ee" font-size="8" text-anchor="middle" font-family="monospace">SSL Termination</text>
      <text x="520" y="275" fill="#22d3ee" font-size="8" text-anchor="middle" font-family="monospace">Security Headers</text>
      <text x="520" y="290" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">HTTP/2 + HTTP/3</text>
      
      <!-- ACM Certificate Badge -->
      <rect x="580" y="115" width="70" height="50" rx="4" fill="#232f3e" stroke="#f59e0b" stroke-width="2"/>
      <use href="#certificate-icon" x="592" y="120" width="20" height="20"/>
      <text x="615" y="152" fill="#f59e0b" font-size="8" text-anchor="middle" font-weight="bold" font-family="monospace">ACM</text>
      <text x="615" y="162" fill="#fbbf24" font-size="6" text-anchor="middle" font-family="monospace">TLS 1.2+</text>
      
      <!-- Arrow CloudFront to S3 -->
      <line x1="610" y1="220" x2="695" y2="220" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowheadGreen)"/>
      <text x="653" y="210" fill="#8B5CF6" font-size="8" text-anchor="middle" font-family="monospace">OAC</text>
      
      <!-- S3 Bucket -->
      <rect x="700" y="140" width="180" height="160" rx="8" fill="#232f3e" stroke="#22c55e" stroke-width="2"/>
      <use href="#s3-icon" x="715" y="155" width="40" height="40"/>
      <text x="790" y="185" fill="#22c55e" font-size="14" text-anchor="middle" font-weight="bold" font-family="monospace">S3 Bucket</text>
      <text x="790" y="205" fill="#4ade80" font-size="9" text-anchor="middle" font-family="monospace">Static Website Origin</text>
      <text x="790" y="225" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">website-prod-a1b2c3d4</text>
      <text x="790" y="245" fill="#22d3ee" font-size="8" text-anchor="middle" font-family="monospace">Private Access Only</text>
      <text x="790" y="260" fill="#22d3ee" font-size="8" text-anchor="middle" font-family="monospace">Versioning Enabled</text>
      <text x="790" y="275" fill="#22d3ee" font-size="8" text-anchor="middle" font-family="monospace">AES-256 Encryption</text>
      <text x="790" y="290" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="monospace">Lifecycle: 30 day cleanup</text>

      <!-- S3 Contents Preview -->
      <rect x="730" y="330" width="120" height="80" rx="4" fill="#1e293b" stroke="#374151" stroke-width="1"/>
      <text x="790" y="348" fill="#9ca3af" font-size="8" text-anchor="middle" font-family="monospace">📁 Contents</text>
      <text x="790" y="365" fill="#60a5fa" font-size="7" text-anchor="middle" font-family="monospace">index.html</text>
      <text x="790" y="378" fill="#60a5fa" font-size="7" text-anchor="middle" font-family="monospace">error.html</text>
      <text x="790" y="391" fill="#a78bfa" font-size="7" text-anchor="middle" font-family="monospace">/assets/*</text>
      <text x="790" y="404" fill="#a78bfa" font-size="7" text-anchor="middle" font-family="monospace">/js/* /css/*</text>
      
      <!-- Edge Locations Indicator -->
      <rect x="450" y="330" width="140" height="60" rx="4" fill="#1e293b" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4,2"/>
      <text x="520" y="350" fill="#8B5CF6" font-size="9" text-anchor="middle" font-weight="bold" font-family="monospace">🌐 Edge Locations</text>
      <text x="520" y="368" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="monospace">PriceClass_100</text>
      <text x="520" y="382" fill="#6b7280" font-size="7" text-anchor="middle" font-family="monospace">NA, EU (Low Latency)</text>

      <!-- Flow Labels -->
      <text x="500" y="430" fill="#9ca3af" font-size="10" text-anchor="middle" font-family="monospace">User → CloudFlare DNS → CloudFront CDN → S3 Origin</text>
      <text x="500" y="445" fill="#6b7280" font-size="8" text-anchor="middle" font-family="monospace">Global distribution with edge caching • SSL/TLS encryption • $1-5/month</text>
    </svg>
  </div>
</body>
</html>
