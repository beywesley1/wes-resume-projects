<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPC Sales Website - Architecture Diagram</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    h1 {
      color: #c9d1d9;
      margin-bottom: 20px;
      font-size: 24px;
    }
    .instructions {
      color: #8b949e;
      margin-bottom: 20px;
      text-align: center;
      max-width: 800px;
      line-height: 1.6;
    }
    .instructions code {
      background: #21262d;
      padding: 2px 6px;
      border-radius: 4px;
      color: #58a6ff;
    }
    .diagram-container {
      background: #161b22;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #30363d;
      overflow: auto;
      max-width: 100%;
    }
    svg {
      display: block;
    }
  </style>
</head>
<body>
  <h1>VPC Sales Website - Architecture Diagram</h1>
  <p class="instructions">
    Edit this file to modify the diagram. Open in browser to preview.<br>
    SVG coordinates: <code>x</code> = horizontal, <code>y</code> = vertical (top-down).<br>
    Tip: Use browser DevTools (F12) to inspect and test changes live.
  </p>
  
  <div class="diagram-container">
    <svg viewBox="0 0 1200 750" width="1200" height="750">
      <!-- Background Gradients & Definitions -->
      <defs>
        <linearGradient id="vpcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1a1a2e" />
          <stop offset="100%" stop-color="#16213e" />
        </linearGradient>
        <linearGradient id="subnetGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0f3460" />
          <stop offset="100%" stop-color="#1a1a2e" />
        </linearGradient>
        <linearGradient id="privateSubnetGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#1e1b4b" />
          <stop offset="100%" stop-color="#1a1a2e" />
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#8B5CF6"/>
        </marker>
        <marker id="arrowheadOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#F6821F"/>
        </marker>
        <marker id="arrowheadYellow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#FF9900"/>
        </marker>
        <marker id="arrowheadGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
        </marker>
        
        <!-- AWS Service Icons -->
        <symbol id="aws-vpc-icon" viewBox="0 0 24 24">
          <rect x="2" y="2" width="20" height="20" rx="2" fill="none" stroke="#8B5CF6" stroke-width="2"/>
          <path d="M7 7h10v10H7z" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
          <circle cx="12" cy="12" r="2" fill="#8B5CF6"/>
        </symbol>
        <symbol id="aws-ec2-icon" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" fill="#FF9900"/>
          <rect x="6" y="8" width="12" height="8" rx="1" fill="#232f3e"/>
          <circle cx="9" cy="12" r="1.5" fill="#FF9900"/>
          <circle cx="15" cy="12" r="1.5" fill="#FF9900"/>
        </symbol>
        <symbol id="aws-rds-icon" viewBox="0 0 24 24">
          <ellipse cx="12" cy="6" rx="8" ry="3" fill="#3B48CC"/>
          <path d="M4 6v12c0 1.66 3.58 3 8 3s8-1.34 8-3V6" fill="none" stroke="#3B48CC" stroke-width="2"/>
          <ellipse cx="12" cy="12" rx="8" ry="3" fill="none" stroke="#3B48CC" stroke-width="1"/>
          <ellipse cx="12" cy="18" rx="8" ry="3" fill="none" stroke="#3B48CC" stroke-width="1"/>
        </symbol>
        <symbol id="aws-alb-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" fill="none" stroke="#8B5CF6" stroke-width="2"/>
          <path d="M12 6v12M6 12h12" stroke="#8B5CF6" stroke-width="2"/>
          <circle cx="12" cy="12" r="3" fill="#8B5CF6"/>
        </symbol>
        <symbol id="aws-waf-icon" viewBox="0 0 24 24">
          <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z" fill="none" stroke="#ef4444" stroke-width="2"/>
          <path d="M9 12l2 2 4-4" stroke="#ef4444" stroke-width="2" fill="none"/>
        </symbol>
        <symbol id="aws-igw-icon" viewBox="0 0 24 24">
          <rect x="4" y="8" width="16" height="8" rx="2" fill="none" stroke="#FF9900" stroke-width="2"/>
          <path d="M12 4v4M12 16v4M4 12H2M22 12h-2" stroke="#FF9900" stroke-width="2"/>
        </symbol>
        <symbol id="cloudflare-icon" viewBox="0 0 24 24">
          <path d="M16.5 8.5c-.3-1.4-1.5-2.5-3-2.5-1.3 0-2.4.8-2.9 2-.4-.3-.9-.5-1.4-.5-1.4 0-2.5 1.1-2.5 2.5 0 .2 0 .3.1.5C5.2 10.7 4 12 4 13.5 4 15.4 5.6 17 7.5 17h9c1.9 0 3.5-1.6 3.5-3.5 0-1.8-1.4-3.3-3.1-3.5l-.4-1.5z" fill="#F6821F"/>
          <path d="M17.8 12.8l-1.3-4.5c-.1-.4-.5-.6-.9-.5l-4.1 1.2c-.3.1-.5.3-.5.6l-.3 3.9c0 .2.1.4.3.5.2.1.4.1.6 0l1.5-.8 1.4 1.4c.2.2.4.2.6.1.2-.1.3-.3.3-.5l.3-1.8 1.8.3c.2 0 .4-.1.5-.3.1-.2.1-.4-.2-.6z" fill="#FAAD3F"/>
        </symbol>
        <symbol id="eip-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8" fill="none" stroke="#22c55e" stroke-width="2"/>
          <text x="12" y="16" fill="#22c55e" font-size="10" text-anchor="middle" font-family="monospace" font-weight="bold">IP</text>
        </symbol>
        <symbol id="internet-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" fill="none" stroke="#60a5fa" stroke-width="2"/>
          <ellipse cx="12" cy="12" rx="4" ry="10" fill="none" stroke="#60a5fa" stroke-width="1"/>
          <line x1="2" y1="12" x2="22" y2="12" stroke="#60a5fa" stroke-width="1"/>
          <line x1="12" y1="2" x2="12" y2="22" stroke="#60a5fa" stroke-width="1"/>
        </symbol>
      </defs>
      
      <!-- INTERNET (Top) -->
      <rect x="520" y="15" width="160" height="50" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
      <use href="#internet-icon" x="535" y="23" width="30" height="30"/>
      <text x="600" y="45" fill="#60a5fa" font-size="14" text-anchor="middle" font-weight="bold" font-family="monospace">Internet</text>
      
      <!-- CloudFlare DNS & CDN - Left of Internet -->
      <rect x="40" y="10" width="200" height="70" rx="8" fill="#1a1a2e" stroke="#F6821F" stroke-width="2"/>
      <use href="#cloudflare-icon" x="50" y="23" width="40" height="40"/>
      <text x="140" y="35" fill="#F6821F" font-size="13" text-anchor="middle" font-weight="bold" font-family="monospace">CloudFlare</text>
      <text x="140" y="52" fill="#FAAD3F" font-size="9" text-anchor="middle" font-family="monospace">DNS + CDN + DDoS + SSL</text>
      <text x="140" y="68" fill="#6ee7b7" font-size="9" text-anchor="middle" font-family="monospace">sales-website.com</text>
      
      <!-- Arrow CloudFlare to Internet -->
      <line x1="240" y1="45" x2="515" y2="40" stroke="#F6821F" stroke-width="2" marker-end="url(#arrowheadOrange)"/>
      <text x="380" y="35" fill="#F6821F" font-size="9" text-anchor="middle" font-family="monospace">DNS Resolution</text>
      
      <!-- AWS Cloud Border -->
      <rect x="300" y="80" width="880" height="650" rx="12" fill="none" stroke="#FF9900" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
      <text x="740" y="105" fill="#FF9900" font-size="16" font-family="monospace" font-weight="bold">AWS Cloud (us-east-1)</text>
      
      <!-- Arrow Internet to IGW -->
      <line x1="600" y1="65" x2="600" y2="120" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowheadYellow)"/>
      
      <!-- Internet Gateway - At VPC Edge -->
      <rect x="530" y="125" width="140" height="45" rx="6" fill="#232f3e" stroke="#FF9900" stroke-width="2"/>
      <use href="#aws-igw-icon" x="540" y="133" width="28" height="28"/>
      <text x="620" y="152" fill="#FF9900" font-size="13" text-anchor="middle" font-family="monospace" font-weight="bold">IGW</text>
      
      <!-- VPC Container -->
      <rect x="320" y="185" width="840" height="530" rx="10" fill="url(#vpcGradient)" stroke="#8B5CF6" stroke-width="3"/>
      <use href="#aws-vpc-icon" x="335" y="195" width="24" height="24"/>
      <text x="365" y="212" fill="#8B5CF6" font-size="14" font-weight="bold" font-family="monospace">VPC</text>
      <text x="335" y="228" fill="#a78bfa" font-size="11" font-family="monospace">10.11.0.0/16</text>
      
      <!-- Arrow IGW to ALB -->
      <line x1="600" y1="170" x2="600" y2="230" stroke="#FF9900" stroke-width="2" marker-end="url(#arrowheadYellow)"/>
      
      <!-- Application Load Balancer + WAF Combined -->
      <rect x="430" y="235" width="340" height="70" rx="8" fill="#232f3e" stroke="#8B5CF6" stroke-width="2" filter="url(#glow)"/>
      <use href="#aws-alb-icon" x="445" y="250" width="35" height="35"/>
      <text x="600" y="260" fill="#8B5CF6" font-size="14" text-anchor="middle" font-weight="bold" font-family="monospace">Application Load Balancer</text>
      <text x="600" y="278" fill="#a78bfa" font-size="10" text-anchor="middle" font-family="monospace">sales-website-alb.amazonaws.com</text>
      
      <!-- WAF Badge attached to ALB -->
      <rect x="700" y="240" width="60" height="40" rx="4" fill="#232f3e" stroke="#ef4444" stroke-width="2"/>
      <use href="#aws-waf-icon" x="708" y="245" width="20" height="20"/>
      <text x="730" y="273" fill="#ef4444" font-size="8" text-anchor="middle" font-weight="bold" font-family="monospace">WAF</text>
      
      <!-- WAF Label -->
      <text x="730" y="295" fill="#fca5a5" font-size="8" text-anchor="middle" font-family="monospace">SQL/XSS Protection</text>
      
      <!-- PUBLIC SUBNETS SECTION -->
      <text x="340" y="330" fill="#22c55e" font-size="14" font-weight="bold" font-family="monospace">PUBLIC SUBNETS (Web Tier)</text>
      
      <!-- Subnet A -->
      <rect x="340" y="345" width="250" height="155" rx="8" fill="url(#subnetGradient)" stroke="#22c55e" stroke-width="2"/>
      <text x="465" y="365" fill="#22c55e" font-size="12" text-anchor="middle" font-weight="bold" font-family="monospace">Public Subnet A</text>
      <text x="465" y="380" fill="#4ade80" font-size="9" text-anchor="middle" font-family="monospace">10.11.1.0/24 | us-east-1a</text>
      
      <!-- Server 1A with EIP -->
      <rect x="355" y="395" width="100" height="55" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
      <use href="#aws-ec2-icon" x="363" y="403" width="18" height="18"/>
      <text x="405" y="418" fill="#3b82f6" font-size="9" text-anchor="middle" font-weight="bold" font-family="monospace">Server 1A</text>
      <text x="405" y="432" fill="#60a5fa" font-size="8" text-anchor="middle" font-family="monospace">10.11.1.10</text>
      <text x="405" y="444" fill="#6b7280" font-size="7" text-anchor="middle" font-family="monospace">t3.medium</text>
      <!-- EIP badge -->
      <rect x="430" y="390" width="30" height="18" rx="3" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
      <text x="445" y="402" fill="#22c55e" font-size="7" text-anchor="middle" font-family="monospace">EIP</text>
      
      <!-- Server 2A with EIP (ASG) -->
      <rect x="475" y="395" width="100" height="55" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <use href="#aws-ec2-icon" x="483" y="403" width="18" height="18"/>
      <text x="525" y="418" fill="#f59e0b" font-size="9" text-anchor="middle" font-weight="bold" font-family="monospace">Server 2A</text>
      <text x="525" y="432" fill="#fbbf24" font-size="8" text-anchor="middle" font-family="monospace">10.11.1.11</text>
      <text x="525" y="444" fill="#6b7280" font-size="7" text-anchor="middle" font-family="monospace">ASG Scaled</text>
      <!-- EIP badge -->
      <rect x="550" y="390" width="30" height="18" rx="3" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
      <text x="565" y="402" fill="#22c55e" font-size="7" text-anchor="middle" font-family="monospace">EIP</text>
      
      <!-- ASG indicator A -->
      <rect x="355" y="460" width="220" height="20" rx="4" fill="#292524" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,2"/>
      <text x="465" y="474" fill="#f59e0b" font-size="8" text-anchor="middle" font-family="monospace">⚡ ASG: 2/3 (High Traffic)</text>
      
      <!-- Subnet B -->
      <rect x="610" y="345" width="250" height="155" rx="8" fill="url(#subnetGradient)" stroke="#22c55e" stroke-width="2"/>
      <text x="735" y="365" fill="#22c55e" font-size="12" text-anchor="middle" font-weight="bold" font-family="monospace">Public Subnet B</text>
      <text x="735" y="380" fill="#4ade80" font-size="9" text-anchor="middle" font-family="monospace">10.11.2.0/24 | us-east-1b</text>
      
      <!-- Server 1B with EIP -->
      <rect x="680" y="395" width="110" height="55" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
      <use href="#aws-ec2-icon" x="688" y="403" width="18" height="18"/>
      <text x="735" y="418" fill="#3b82f6" font-size="9" text-anchor="middle" font-weight="bold" font-family="monospace">Server 1B</text>
      <text x="735" y="432" fill="#60a5fa" font-size="8" text-anchor="middle" font-family="monospace">10.11.2.10</text>
      <text x="735" y="444" fill="#6b7280" font-size="7" text-anchor="middle" font-family="monospace">t3.medium</text>
      <!-- EIP badge -->
      <rect x="765" y="390" width="30" height="18" rx="3" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
      <text x="780" y="402" fill="#22c55e" font-size="7" text-anchor="middle" font-family="monospace">EIP</text>
      
      <!-- ASG indicator B -->
      <rect x="625" y="460" width="220" height="20" rx="4" fill="#292524" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,2"/>
      <text x="735" y="474" fill="#22c55e" font-size="8" text-anchor="middle" font-family="monospace">ASG: 1/3 (Normal)</text>
      
      <!-- Subnet C -->
      <rect x="880" y="345" width="250" height="155" rx="8" fill="url(#subnetGradient)" stroke="#22c55e" stroke-width="2"/>
      <text x="1005" y="365" fill="#22c55e" font-size="12" text-anchor="middle" font-weight="bold" font-family="monospace">Public Subnet C</text>
      <text x="1005" y="380" fill="#4ade80" font-size="9" text-anchor="middle" font-family="monospace">10.11.3.0/24 | us-east-1c</text>
      
      <!-- Server 1C with EIP -->
      <rect x="950" y="395" width="110" height="55" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
      <use href="#aws-ec2-icon" x="958" y="403" width="18" height="18"/>
      <text x="1005" y="418" fill="#3b82f6" font-size="9" text-anchor="middle" font-weight="bold" font-family="monospace">Server 1C</text>
      <text x="1005" y="432" fill="#60a5fa" font-size="8" text-anchor="middle" font-family="monospace">10.11.3.10</text>
      <text x="1005" y="444" fill="#6b7280" font-size="7" text-anchor="middle" font-family="monospace">t3.medium</text>
      <!-- EIP badge -->
      <rect x="1035" y="390" width="30" height="18" rx="3" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
      <text x="1050" y="402" fill="#22c55e" font-size="7" text-anchor="middle" font-family="monospace">EIP</text>
      
      <!-- ASG indicator C -->
      <rect x="895" y="460" width="220" height="20" rx="4" fill="#292524" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,2"/>
      <text x="1005" y="474" fill="#22c55e" font-size="8" text-anchor="middle" font-family="monospace">ASG: 1/3 (Normal)</text>
      
      <!-- Connection lines from ALB to subnets -->
      <line x1="520" y1="305" x2="465" y2="345" stroke="#8B5CF6" stroke-width="2" opacity="0.8"/>
      <line x1="600" y1="305" x2="735" y2="345" stroke="#8B5CF6" stroke-width="2" opacity="0.8"/>
      <line x1="680" y1="305" x2="1005" y2="345" stroke="#8B5CF6" stroke-width="2" opacity="0.8"/>
      
      <!-- PRIVATE SUBNETS SECTION - moved down 20px -->
      <text x="340" y="530" fill="#a855f7" font-size="14" font-weight="bold" font-family="monospace">PRIVATE SUBNETS (Database Tier)</text>
      
      <!-- Private Subnet A -->
      <rect x="340" y="545" width="250" height="120" rx="8" fill="url(#privateSubnetGradient)" stroke="#a855f7" stroke-width="2"/>
      <text x="465" y="565" fill="#a855f7" font-size="12" text-anchor="middle" font-weight="bold" font-family="monospace">Private Subnet A</text>
      <text x="465" y="580" fill="#c084fc" font-size="9" text-anchor="middle" font-family="monospace">10.11.101.0/24 | us-east-1a</text>
      
      <!-- RDS Writer -->
      <rect x="360" y="595" width="210" height="55" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
      <use href="#aws-rds-icon" x="370" y="603" width="20" height="20"/>
      <text x="475" y="615" fill="#06b6d4" font-size="10" text-anchor="middle" font-weight="bold" font-family="monospace">RDS Writer</text>
      <text x="465" y="630" fill="#22d3ee" font-size="8" text-anchor="middle" font-family="monospace">10.11.101.10 | db.r5.large</text>
      <text x="465" y="642" fill="#6b7280" font-size="7" text-anchor="middle" font-family="monospace">PostgreSQL 15 | Primary</text>
      
      <!-- Private Subnet B -->
      <rect x="610" y="545" width="250" height="120" rx="8" fill="url(#privateSubnetGradient)" stroke="#a855f7" stroke-width="2"/>
      <text x="735" y="565" fill="#a855f7" font-size="12" text-anchor="middle" font-weight="bold" font-family="monospace">Private Subnet B</text>
      <text x="735" y="580" fill="#c084fc" font-size="9" text-anchor="middle" font-family="monospace">10.11.102.0/24 | us-east-1b</text>
      
      <!-- RDS Reader -->
      <rect x="630" y="595" width="210" height="55" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <use href="#aws-rds-icon" x="640" y="603" width="20" height="20"/>
      <text x="745" y="615" fill="#10b981" font-size="10" text-anchor="middle" font-weight="bold" font-family="monospace">RDS Reader</text>
      <text x="735" y="630" fill="#34d399" font-size="8" text-anchor="middle" font-family="monospace">10.11.102.10 | db.r5.large</text>
      <text x="735" y="642" fill="#6b7280" font-size="7" text-anchor="middle" font-family="monospace">PostgreSQL 15 | Replica</text>
      
      <!-- Private Subnet C -->
      <rect x="880" y="545" width="250" height="120" rx="8" fill="url(#privateSubnetGradient)" stroke="#a855f7" stroke-width="2"/>
      <text x="1005" y="565" fill="#a855f7" font-size="12" text-anchor="middle" font-weight="bold" font-family="monospace">Private Subnet C</text>
      <text x="1005" y="580" fill="#c084fc" font-size="9" text-anchor="middle" font-family="monospace">10.11.103.0/24 | us-east-1c</text>
      
      <!-- Failover Standby -->
      <rect x="900" y="595" width="210" height="55" rx="6" fill="#1e293b" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,2"/>
      <text x="1005" y="620" fill="#6b7280" font-size="9" text-anchor="middle" font-family="monospace">Failover Standby</text>
      <text x="1005" y="635" fill="#4b5563" font-size="8" text-anchor="middle" font-family="monospace">(Multi-AZ Ready)</text>
      
      <!-- RDS Replication line -->
      <line x1="570" y1="622" x2="630" y2="622" stroke="#06b6d4" stroke-width="2" stroke-dasharray="5,3"/>
      <text x="600" y="615" fill="#06b6d4" font-size="8" text-anchor="middle" font-family="monospace">sync</text>
      
      <!-- Connection: Server 1A (primary) to RDS Writer (writes) -->
      <line x1="370" y1="450" x2="370" y2="520" stroke="#06b6d4" stroke-width="1.5" opacity="0.6"/>
      <line x1="370" y1="520" x2="420" y2="545" stroke="#06b6d4" stroke-width="1.5" opacity="0.6"/>
      <text x="345" y="490" fill="#06b6d4" font-size="7" font-family="monospace">writes</text>
      
      <!-- Connection: RDS Reader to all public subnets (reads) -->
      <line x1="840" y1="595" x2="840" y2="500" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
